spring.application.name=supplycart-api
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/supplycart}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
spring.session.timeout=30m
spring.session.store-type=redis
spring.session.redis.namespace=supplycart:sessions
spring.session.redis.flush-mode=on_save

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.timeout=2s

spring.cache.type=redis
spring.cache.redis.time-to-live=5m
spring.cache.redis.key-prefix=supplycart:cache:
spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=false

# Order events are optional outside Docker/production. Keeping checkout synchronous
# preserves inventory consistency; Kafka handles downstream work after commit.
app.kafka.enabled=${KAFKA_ENABLED:false}
app.kafka.order-topic=${KAFKA_ORDER_TOPIC:supplycart.order-events.v1}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.fail-fast=false
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.delivery.timeout.ms=120000
spring.kafka.producer.properties.request.timeout.ms=30000
spring.kafka.producer.properties.retries=5

app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoint.health.group.liveness.include=livenessState
# Kafka is an asynchronous integration. A broker outage must not mark checkout unavailable.
management.health.kafka.enabled=false

spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.pattern.level=%5p [${spring.application.name:},%X{requestId:-}]
