spring.application.name=supplycart-api
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/supplycart}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m
spring.session.timeout=30m
spring.session.store-type=redis
spring.session.redis.namespace=supplycart:sessions
spring.session.redis.flush-mode=on_save

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6380}
spring.data.redis.timeout=2s

spring.cache.type=redis
spring.cache.redis.time-to-live=5m
spring.cache.redis.key-prefix=supplycart:cache:
spring.cache.redis.use-key-prefix=true
spring.cache.redis.cache-null-values=false

app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis
management.endpoint.health.group.liveness.include=livenessState

spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

logging.pattern.level=%5p [${spring.application.name:},%X{requestId:-}]
