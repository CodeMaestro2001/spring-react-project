name: SupplyCart CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: supplycart-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: bash ./backend/mvnw -B -ntp -f backend/pom.xml verify

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  containers:
    name: Validate Compose and build images
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f infra/compose.yaml config --quiet
      - name: Build application images
        run: docker compose --env-file .env.example -f infra/compose.yaml build
      - name: Start stack and verify PostgreSQL migrations and health
        run: docker compose --env-file .env.example -f infra/compose.yaml up --wait -d
      - name: Stop stack and remove its temporary database volume
        if: always()
        run: docker compose --env-file .env.example -f infra/compose.yaml down --volumes
