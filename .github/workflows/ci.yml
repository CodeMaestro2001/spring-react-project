name: SupplyCart CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: supplycart-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt an in-progress production rollout when another push arrives.
  cancel-in-progress: false

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify backend
        run: bash ./backend/mvnw -B -ntp -f backend/pom.xml verify

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  containers:
    name: Validate Compose and build images
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example -f infra/compose.yaml config --quiet
      - name: Build application images
        run: docker compose --env-file .env.example -f infra/compose.yaml build
      - name: Start stack and verify PostgreSQL migrations and health
        run: docker compose --env-file .env.example -f infra/compose.yaml up --wait -d
      - name: Stop stack and remove its temporary database volume
        if: always()
        run: docker compose --env-file .env.example -f infra/compose.yaml down --volumes

  deploy:
    name: Deploy to Contabo VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, containers]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "Missing DEPLOY_HOST secret"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing DEPLOY_USER secret"; exit 1; }
          test -n "$DEPLOY_SSH_KEY" || { echo "Missing DEPLOY_SSH_KEY secret"; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H "$DEPLOY_HOST" > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Copy application source to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST" || { echo "Missing DEPLOY_HOST secret"; exit 1; }
          test -n "$DEPLOY_USER" || { echo "Missing DEPLOY_USER secret"; exit 1; }
          rsync -az --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='frontend/node_modules/' \
            --exclude='backend/target/' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/supplycart/"

      - name: Rebuild and restart SupplyCart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            docker compose -p supplycart \
              --project-directory /opt/supplycart/infra \
              --env-file /opt/supplycart/.env \
              -f /opt/supplycart/infra/compose.yaml \
              -f /opt/supplycart/infra/compose.npm.yaml \
              up --build -d
          '
